name: Publish Shanhezhi

on:
  push:
    branches: [main]
    paths:
      - shanhezhi-v17-web.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract game release
        run: python -m zipfile -e shanhezhi-v17-web.zip _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v5
